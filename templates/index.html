<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像翻訳アプリ</title>
    <!-- Tailwind CSS (デザイン用) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-2xl w-full bg-slate-800 rounded-2xl shadow-xl border border-slate-700 p-6 md:p-8 space-y-6">
        
        <!-- ヘッダー -->
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-bold tracking-tight text-white">📷 画像翻訳アプリ</h1>
            <p class="text-slate-400 text-sm">画像を選択すると、AIが自動で文字を抽出して日本語に翻訳します。</p>
        </div>

        <!-- 送信フォーム -->
        <form action="/" method="post" enctype="multipart/form-data" class="space-y-4">
            <div class="flex flex-col items-center justify-center w-full">
                <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-slate-600 border-dashed rounded-xl cursor-pointer bg-slate-700/50 hover:bg-slate-700 hover:border-indigo-500 transition-all">
                    <div class="flex flex-col items-center justify-center pt-5 pb-6">
                        <svg class="w-8 h-8 mb-2 text-slate-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 16">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
                        </svg>
                        <p class="text-sm text-slate-300 font-medium">クリックして画像を選択</p>
                    </div>
                    <input type="file" name="image" accept="image/*" required class="hidden" onchange="document.getElementById('file-name').innerText = this.files[0].name">
                </label>
                <p id="file-name" class="mt-2 text-xs text-indigo-400 font-medium h-4"></p>
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg hover:shadow-indigo-500/25 transition-all">
                画像を翻訳する
            </button>
        </form>

        <!-- 翻訳結果カード -->
        {% if translated_text %}
        <div class="mt-8 border-t border-slate-700 pt-6 space-y-4">
            <h2 class="text-xl font-semibold text-indigo-400 flex items-center gap-2">
                <span>✨ 翻訳結果</span>
                {% if detected_lang %}
                    <span class="text-xs bg-slate-700 text-slate-300 font-normal px-2.5 py-1 rounded-full border border-slate-600">
                        検出言語: {{ detected_lang }}
                    </span>
                {% endif %}
            </h2>

            <!-- 抽出テキスト -->
            <div class="bg-slate-900/60 rounded-xl p-4 border border-slate-700/60">
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">抽出テキスト</h3>
                <p class="text-slate-200 whitespace-pre-wrap leading-relaxed text-sm">{{ ocr_text }}</p>
            </div>

            <!-- 日本語翻訳 -->
            <div class="bg-indigo-950/40 rounded-xl p-4 border border-indigo-500/30">
                <h3 class="text-xs font-semibold text-indigo-300 uppercase tracking-wider mb-2">日本語翻訳</h3>
                <p class="text-white whitespace-pre-wrap leading-relaxed font-medium">{{ translated_text }}</p>
            </div>
        </div>
        {% endif %}

    </div>

</body>
</html>
