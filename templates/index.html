<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ ui.title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 selection:bg-indigo-500 selection:text-white relative">

    <div class="max-w-xl w-full bg-slate-900 rounded-3xl shadow-2xl border border-slate-800 p-5 md:p-7 flex-grow flex flex-col justify-between my-auto">
        
        <!-- コンポーネント: ヘッダー＆言語バー -->
        {% include 'components/header.html' %}

        <!-- コンポーネント: 翻訳タブ画面群 -->
        <div class="flex-grow flex flex-col justify-center">
            {% include 'components/tabs.html' %}
        </div>

        <!-- コンポーネント: 下部ナビゲーション -->
        {% include 'components/nav.html' %}

    </div>

    <!-- 言語選択モーダル（ページ遷移なしのポップアップ画面） -->
    <div id="lang-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-3xl p-5 md:p-6 shadow-2xl flex flex-col max-h-[80vh]">
            
            <!-- モーダルヘッダー -->
            <div class="flex justify-between items-center pb-3 border-b border-slate-800">
                <h3 id="modal-title" class="text-base font-bold text-slate-100">言語を選択</h3>
                <button type="button" onclick="closeLangModal()" class="text-slate-400 hover:text-white p-2 text-lg transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- 言語検索バー -->
            <div class="mt-4 mb-2">
                <input type="text" id="lang-search-input" onkeyup="filterLanguages()" placeholder="言語を検索..." 
                       class="w-full px-4 py-2.5 rounded-2xl bg-slate-950 text-slate-100 border border-slate-800 text-sm focus:outline-none focus:border-indigo-500 placeholder-slate-600">
            </div>

            <!-- 言語リスト表示エリア -->
            <div id="lang-list" class="overflow-y-auto flex-grow space-y-1.5 my-2 pr-1 text-sm">
                <!-- JavaScriptで言語ボタンを自動生成します -->
            </div>

        </div>
    </div>

    <!-- コンポーネント: JavaScript -->
    {% include 'components/scripts.html' %}

</body>
</html>
