<!DOCTYPE html>
<html lang="{{ 'ja' if target_lang == 'Japanese' else 'en' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{ ui.title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between px-4 selection:bg-indigo-500 selection:text-white">

    <div class="max-w-xl w-full bg-slate-900 rounded-3xl shadow-2xl border border-slate-800 p-5 md:p-7 flex-grow flex flex-col justify-between my-auto">
        {% include 'components/header.html' %}

        {% if error %}
        <div role="alert" class="mb-4 p-3 rounded-2xl bg-red-950/60 border border-red-800 text-red-200 text-sm flex items-start gap-2">
            <i class="fa-solid fa-circle-exclamation mt-0.5"></i><span>{{ error }}</span>
        </div>
        {% endif %}

        <div class="flex-grow flex flex-col justify-center">
            {% include 'components/tabs.html' %}
        </div>

        {% include 'components/nav.html' %}
    </div>

    {% include 'components/scripts.html' %}
</body>
</html>
