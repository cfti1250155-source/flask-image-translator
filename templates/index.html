<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像翻訳アプリ</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-2xl w-full bg-slate-800 rounded-2xl shadow-xl border border-slate-700 p-6 md:p-8">
        
        <!-- ヘッダー -->
        <div class="text-center space-y-2 mb-6">
            <h1 class="text-3xl font-bold tracking-tight text-white">📷 画像翻訳アプリ</h1>
            <p class="text-slate-400 text-sm">画像を選択すると、AIが自動で文字を抽出して日本語に翻訳します。</p>
        </div>

        <!-- 送信フォーム -->
        <form action="/" method="POST" enctype="multipart/form-data" class="space-y-4">
            <div class="flex flex-col items-center justify-center w-full">
                <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-slate-600 border-dashed rounded-xl cursor-pointer bg-slate-700/50 hover:bg-slate-700 transition">
                    <div class="flex flex-col items-center justify-center pt-5 pb-6">
                        <p class="text-sm text-slate-300 font-medium">クリックして画像を選択</p>
                    </div>
                    <input type="file" name="image" accept="image/*" required class="hidden" onchange="document.getElementById('file-name').innerText = this.files[0].name">
                </label>
                <p id="file-name" class="text-xs text-indigo-400 mt-2 h-4"></p>
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg transition">
                画像を翻訳する
            </button>
        </form>

        <!-- 結果表示部分 -->
        <% if ocr_text or translated_text %>
        <div class="mt-8 space-y-4 pt-6 border-t border-slate-700">
            <% if ocr_text %>
            <div>
                <h2 class="text-sm font-medium text-slate-400 mb-1">抽出されたテキスト (OCR)</h2>
                <div class="p-4 bg-slate-900 rounded-xl border border-slate-700 text-slate-200 text-sm whitespace-pre-wrap"><%= ocr_text %></div>
            </div>
            <% endif %>

            <% if translated_text %>
            <div>
                <h2 class="text-sm font-medium text-indigo-400 mb-1">翻訳・AI校正結果</h2>
                <div class="p-4 bg-indigo-950/50 rounded-xl border border-indigo-800 text-indigo-100 text-base font-medium whitespace-pre-wrap"><%= translated_text %></div>
            </div>
            <% endif %>
        </div>
        <% endif %>

    </div>

</body>
</html>
