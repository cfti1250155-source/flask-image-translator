<!DOCTYPE html>
<html lang="{{ ui_code }}" dir="{{ 'rtl' if ui_rtl else 'ltr' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{ ui.privacy_title }} - TOOKIE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=asset_v) }}">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center px-4">
    <main class="max-w-md w-full bg-slate-900 rounded-3xl p-6 border border-slate-800 shadow-2xl space-y-4 my-6">
        <h1 class="text-xl font-bold">{{ ui.privacy_title }}</h1>
        {% for n in [1, 2, 3, 4] %}
        <p class="text-sm text-slate-300 leading-relaxed">{{ ui['privacy_body_' ~ n] }}</p>
        {% endfor %}
        <a href="{{ url_for('index') }}" class="block text-center bg-slate-800 hover:bg-slate-700 rounded-2xl py-2.5 text-sm">{{ ui.privacy_back }}</a>
    </main>
</body>
</html>
