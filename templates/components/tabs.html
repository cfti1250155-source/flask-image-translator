{% from 'components/result.html' import result_box with context %}

<!-- 1. テキスト -->
<div id="tab-text" class="tab-content space-y-4">
    <form action="/" method="POST" class="tx-form space-y-3">
        <input type="hidden" name="mode" value="text">
        <textarea name="direct_text" rows="5" maxlength="5000" class="w-full p-4 rounded-2xl bg-slate-950/70 text-slate-100 border border-slate-800 focus:outline-none focus:border-indigo-500 placeholder-slate-600 resize-none shadow-inner" placeholder="{{ ui.text_placeholder }}">{{ input_text if active_mode == 'text' else '' }}</textarea>
        <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 text-white font-bold py-3 px-4 rounded-2xl shadow-lg transition active:scale-[0.99] flex items-center justify-center gap-2">
            <i class="fa-solid fa-paper-plane"></i> <span class="btn-label">{{ ui.btn_text_translate }}</span>
        </button>
    </form>
    {{ result_box('text') }}
</div>

<!-- 2. 画像 -->
<div id="tab-image" class="tab-content hidden space-y-4">
    <form action="/" method="POST" enctype="multipart/form-data" class="tx-form space-y-4">
        <input type="hidden" name="mode" value="image">
        <div class="flex flex-col items-center justify-center w-full">
            <label class="flex flex-col items-center justify-center w-full h-40 border-2 border-slate-700 border-dashed rounded-2xl cursor-pointer bg-slate-950/40 hover:bg-slate-800/40 transition">
                <div class="flex flex-col items-center justify-center p-4 text-center">
                    <i class="fa-solid fa-image text-3xl text-indigo-400 mb-2"></i>
                    <p class="text-sm text-slate-300 font-medium">{{ ui.image_input_label }}</p>
                    <p class="text-xs text-slate-500 mt-1">PNG, JPG, WEBP, HEIC</p>
                </div>
                <input type="file" name="image" accept="image/*" required class="hidden" onchange="document.getElementById('img-file-name').textContent = this.files[0] ? this.files[0].name : ''">
            </label>
            <p id="img-file-name" class="text-xs text-indigo-400 mt-2 h-4 font-medium break-all"></p>
        </div>
        <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 text-white font-bold py-3 px-4 rounded-2xl shadow-lg transition active:scale-[0.99] flex items-center justify-center gap-2">
            <i class="fa-solid fa-file-invoice"></i> <span class="btn-label">{{ ui.btn_image_translate }}</span>
        </button>
    </form>
    {{ result_box('image', show_original=true) }}
</div>

<!-- 3. 音声 -->
<div id="tab-voice" class="tab-content hidden space-y-4 text-center py-2">
    <div class="space-y-3">
        <button id="start-record-btn" type="button" onclick="toggleVoiceRecording()" class="w-20 h-20 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white rounded-full flex items-center justify-center mx-auto text-3xl border-4 border-indigo-400/40 shadow-xl transition">
            <i id="mic-icon" class="fa-solid fa-microphone"></i>
        </button>
        <p id="voice-status" class="text-xs text-slate-400 font-medium">{{ ui.voice_instruction }}</p>
    </div>

    <form id="voice-form" action="/" method="POST" class="tx-form space-y-3 {{ '' if (active_mode == 'voice' and input_text) else 'hidden' }}">
        <input type="hidden" name="mode" value="voice">
        <textarea id="voice_text" name="voice_text" rows="3" maxlength="5000" class="w-full p-3 rounded-2xl bg-slate-950/70 text-slate-100 border border-slate-800" placeholder="{{ ui.voice_placeholder }}">{{ input_text if active_mode == 'voice' else '' }}</textarea>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 px-4 rounded-2xl shadow-lg transition text-sm">
            <span class="btn-label">{{ ui.btn_voice_translate }}</span>
        </button>
    </form>
    {{ result_box('voice', left=true) }}
</div>

<!-- 4. カメラ -->
<div id="tab-camera" class="tab-content hidden space-y-4 text-center">
    <div class="relative w-full rounded-2xl overflow-hidden border border-slate-800 bg-slate-950 aspect-video flex items-center justify-center">
        <video id="camera-video" autoplay playsinline muted class="w-full h-full object-cover hidden"></video>
        <canvas id="camera-canvas" class="hidden"></canvas>
        <div id="camera-placeholder" class="p-6 text-slate-500 text-xs">
            <i class="fa-solid fa-camera text-3xl text-slate-600 block mb-2"></i>
            {{ ui.camera_instruction }}
        </div>
    </div>

    <form id="camera-form" action="/" method="POST" class="tx-form space-y-3">
        <input type="hidden" name="mode" value="camera">
        <input type="hidden" id="camera_data" name="camera_data" value="">
        <div class="flex gap-2">
            <button type="button" onclick="startCamera()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold py-2.5 px-3 rounded-2xl text-xs transition border border-slate-700 flex items-center justify-center gap-2">
                <i class="fa-solid fa-camera"></i> {{ ui.btn_camera_start }}
            </button>
            <button type="button" id="camera-capture-btn" onclick="captureCamera()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 px-3 rounded-2xl text-xs transition shadow-lg flex items-center justify-center gap-2">
                <i class="fa-solid fa-bolt"></i> <span class="btn-label">{{ ui.btn_camera_capture }}</span>
            </button>
        </div>
    </form>
    {{ result_box('camera', show_original=true, left=true) }}
</div>
