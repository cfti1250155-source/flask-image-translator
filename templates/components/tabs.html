<!-- 2. 画像翻訳モード -->
<div id="tab-image" class="tab-content hidden space-y-4">
    <form action="/" method="POST" enctype="multipart/form-data" class="space-y-4">
        <input type="hidden" name="mode" value="image">
        <div class="flex flex-col items-center justify-center w-full">
            
            <!-- ドラッグ＆ドロップ兼ファイル選択エリア -->
            <label id="image-drop-area" class="relative flex flex-col items-center justify-center w-full min-h-[160px] border-2 border-slate-700 border-dashed rounded-2xl cursor-pointer bg-slate-950/40 hover:bg-slate-800/40 transition overflow-hidden p-4">
                
                <!-- 未選択時のメッセージ -->
                <div id="upload-placeholder" class="flex flex-col items-center justify-center text-center">
                    <i class="fa-solid fa-image text-3xl text-indigo-400 mb-2"></i>
                    <p class="text-sm text-slate-300 font-medium">{{ ui.get('image_input_label', 'Click or drag image here') }}</p>
                    <p class="text-xs text-slate-500 mt-1">PNG, JPG, WEBP</p>
                </div>

                <!-- 選択した画像のプレビュー表示枠（初期状態は非表示） -->
                <img id="image-preview" class="hidden max-h-52 rounded-xl object-contain w-full" alt="Preview">

                <!-- 実際のファイル入力 -->
                <input type="file" id="image-file-input" name="image" accept="image/*" class="hidden">
            </label>

            <p id="img-file-name" class="text-xs text-indigo-400 mt-2 h-4 font-medium"></p>
        </div>

        <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 text-white font-bold py-3 px-4 rounded-2xl shadow-lg transition active:scale-[0.99] flex items-center justify-center gap-2">
            <i class="fa-solid fa-file-invoice"></i> {{ ui.get('btn_image_translate', 'Translate Image') }}
        </button>
    </form>

    {% if translated_text and active_mode == 'image' %}
    <div class="mt-4 p-5 bg-indigo-950/40 rounded-2xl border border-indigo-800/60 space-y-3">
        <div class="flex justify-between items-center border-b border-indigo-900/50 pb-2">
            <div class="flex items-center gap-2">
                <span class="text-xs font-bold text-indigo-400 uppercase tracking-wider">{{ ui.get('result_label', 'Result') }}</span>
                {% if detected_lang %}
                <span class="bg-emerald-950/80 text-emerald-400 text-[10px] font-semibold px-2 py-0.5 rounded-full border border-emerald-800">
                    🌐 {{ detected_lang }}
                </span>
                {% endif %}
            </div>
            <button type="button" onclick="copyResult('resultText-image')" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs transition">
                <i class="fa-solid fa-copy"></i>
            </button>
        </div>
        <div id="resultText-image" class="text-indigo-100 text-base font-medium whitespace-pre-wrap leading-relaxed">{{ translated_text }}</div>
    </div>
    {% endif %}
</div>
