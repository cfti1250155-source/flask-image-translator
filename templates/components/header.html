<!-- ヘッダー（ロゴ ＋ 言語選択バー） -->
<div class="flex items-center justify-between mb-4 mt-2">
    <!-- 左側：インコアイコン + TOOKIEロゴ -->
    <a href="{{ url_for('index') }}" class="flex items-center gap-2.5">
        <img src="{{ url_for('static', filename='Tookie icon.png') }}" 
             alt="TOOKIE Logo" 
             class="w-9 h-9 rounded-xl object-cover border border-slate-700/50 shadow">
        <div class="text-left">
            <span class="text-lg font-extrabold text-white tracking-wider leading-none block mb-0.5">TOOKIE</span>
            <span class="text-[10px] font-medium text-indigo-300">AI Universal Translator</span>
        </div>
    </a>

    <!-- 右側：UI言語切り替えボタン -->
    <a href="{{ url_for('start') }}" title="{{ ui.change_language }}" aria-label="{{ ui.change_language }}" class="flex items-center gap-1.5 px-3 h-9 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-full text-xs border border-slate-700 transition flex-shrink-0">
        <i class="fa-solid fa-globe text-indigo-400"></i><span dir="auto" class="max-w-[5rem] truncate">{{ ui_native }}</span>
    </a>
</div>

<!-- 言語選択バー（翻訳元 ↔ 翻訳先の切り替え） -->
<div id="language-bar-wrapper" class="mb-6 w-full">
    <div id="language-bar" class="flex items-end justify-between gap-2 w-full">
        <div id="source-lang-container" class="flex-1 min-w-0">
            <span class="text-[11px] text-slate-400 block mb-1 font-semibold text-center truncate">{{ ui.source_label }}</span>
            <a href="{{ url_for('select_language', type='source') }}" class="block w-full bg-slate-800/80 hover:bg-slate-700 text-white px-3 py-2.5 rounded-xl border border-slate-700 transition text-center font-medium shadow-sm text-sm truncate">{{ source_display }}</a>
        </div>

        <form id="swap-lang-container" action="{{ url_for('swap_language') }}" method="POST" class="flex-shrink-0">
            <button type="submit" aria-label="swap" class="w-10 h-10 flex items-center justify-center bg-slate-800/80 hover:bg-slate-700 text-indigo-400 hover:text-indigo-300 rounded-full border border-slate-700 transition shadow-sm">
                <i class="fa-solid fa-arrow-right-arrow-left text-xs"></i>
            </button>
        </form>

        <div id="target-lang-container" class="flex-1 min-w-0 transition-all duration-300">
            <span id="target-lang-label" class="text-[11px] text-indigo-400 block mb-1 font-semibold text-center truncate">{{ ui.target_label }}</span>
            <a href="{{ url_for('select_language', type='target') }}" class="block w-full bg-slate-800/80 hover:bg-slate-700 text-white px-3 py-2.5 rounded-xl border border-slate-700 transition text-center font-medium shadow-sm text-sm truncate">{{ target_display }}</a>
        </div>
    </div>
</div>
