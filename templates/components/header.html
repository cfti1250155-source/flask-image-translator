<!-- ヘッダー & アプリ言語切替（翻訳先言語と連動） -->
<div class="flex items-center justify-between mb-4 mt-2">
    <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
        <i class="fa-solid fa-language text-indigo-400"></i> {{ ui.get('title', 'AI Multi-Translator') }}
    </h1>
    <!-- 右上の地球マーク（押すと翻訳先言語選択モーダルが開く） -->
    <button type="button" onclick="openLangModal('target')" title="翻訳先言語を変更" class="text-xs bg-slate-800/90 hover:bg-slate-700 text-indigo-300 hover:text-white px-3.5 py-1.5 rounded-full border border-slate-700 transition flex items-center gap-1.5 font-semibold shadow-sm">
        <i class="fa-solid fa-globe text-indigo-400 text-xs"></i> 
        <span id="header-target-lang">{{ target_lang }}</span>
    </button>
</div>

<!-- 言語選択バー -->
<div id="language-bar-wrapper" class="mb-6 w-full">
    <div id="language-bar" class="flex items-end justify-between gap-2 w-full">
        
        <!-- 翻訳元ボタン -->
        <div id="source-lang-container" class="flex-1 min-w-0">
            <span class="text-[11px] text-slate-400 block mb-1 font-semibold text-center truncate">翻訳元</span>
            <button type="button" onclick="openLangModal('source')" class="w-full bg-slate-800/80 hover:bg-slate-700 text-white px-3 py-2.5 rounded-xl border border-slate-700 transition text-center font-medium shadow-sm text-sm truncate flex items-center justify-center gap-1.5">
                <span id="source-lang-name">{{ source_lang }}</span>
                <i class="fa-solid fa-chevron-down text-[10px] text-slate-400"></i>
            </button>
        </div>
        
        <!-- 入れ替えボタン（ページ遷移せずに即時交換） -->
        <div id="swap-lang-container" class="flex-shrink-0">
            <button type="button" onclick="swapLanguages()" class="w-10 h-10 flex items-center justify-center bg-slate-800/80 hover:bg-slate-700 text-indigo-400 hover:text-indigo-300 rounded-full border border-slate-700 transition shadow-sm hover:shadow-md active:scale-95">
                <i class="fa-solid fa-arrow-right-arrow-left text-xs"></i>
            </button>
        </div>
        
        <!-- 翻訳先ボタン -->
        <div id="target-lang-container" class="flex-1 min-w-0 transition-all duration-300">
            <span id="target-lang-label" class="text-[11px] text-indigo-400 block mb-1 font-semibold text-center truncate">翻訳先</span>
            <button type="button" onclick="openLangModal('target')" class="w-full bg-slate-800/80 hover:bg-slate-700 text-white px-3 py-2.5 rounded-xl border border-slate-700 transition text-center font-medium shadow-sm text-sm truncate flex items-center justify-center gap-1.5">
                <span id="target-lang-name">{{ target_lang }}</span>
                <i class="fa-solid fa-chevron-down text-[10px] text-indigo-400"></i>
            </button>
        </div>

    </div>
</div>
