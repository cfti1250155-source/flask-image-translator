<!-- ヘッダー -->
<div class="flex items-center justify-between mb-4 mt-2">
    <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
        <i class="fa-solid fa-language text-indigo-400"></i> {{ ui.title }}
    </h1>
</div>

<!-- 言語選択バー（翻訳元はテキスト・音声のときだけ表示。画像・カメラはAIが自動判定） -->
<div id="language-bar-wrapper" class="mb-6 w-full">
    <div id="language-bar" class="flex items-end justify-between gap-2 w-full">
        <div id="source-lang-container" class="flex-1 min-w-0">
            <span class="text-[11px] text-slate-400 block mb-1 font-semibold text-center truncate">{{ ui.source_label }}</span>
            <a href="{{ url_for('select_language', type='source') }}" class="block w-full bg-slate-800/80 hover:bg-slate-700 text-white px-3 py-2.5 rounded-xl border border-slate-700 transition text-center font-medium shadow-sm text-sm truncate">{{ source_lang }}</a>
        </div>

        <form id="swap-lang-container" action="{{ url_for('swap_language') }}" method="POST" class="flex-shrink-0">
            <button type="submit" aria-label="swap" class="w-10 h-10 flex items-center justify-center bg-slate-800/80 hover:bg-slate-700 text-indigo-400 hover:text-indigo-300 rounded-full border border-slate-700 transition shadow-sm">
                <i class="fa-solid fa-arrow-right-arrow-left text-xs"></i>
            </button>
        </form>

        <div id="target-lang-container" class="flex-1 min-w-0 transition-all duration-300">
            <span id="target-lang-label" class="text-[11px] text-indigo-400 block mb-1 font-semibold text-center truncate">{{ ui.target_label }}</span>
            <a href="{{ url_for('select_language', type='target') }}" class="block w-full bg-slate-800/80 hover:bg-slate-700 text-white px-3 py-2.5 rounded-xl border border-slate-700 transition text-center font-medium shadow-sm text-sm truncate">{{ target_lang }}</a>
        </div>
    </div>
</div>
