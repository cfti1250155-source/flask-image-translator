<script>
    // 1. 各機能（タブ）の画面切り替え
    function switchTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
        const targetTab = document.getElementById('tab-' + tabName);
        if (targetTab) targetTab.classList.remove('hidden');

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.classList.remove('text-indigo-400', 'bg-indigo-950/40');
            btn.classList.add('text-slate-400');
        });

        const activeBtn = document.getElementById('nav-' + tabName);
        if (activeBtn) {
            activeBtn.classList.remove('text-slate-400');
            activeBtn.classList.add('text-indigo-400', 'bg-indigo-950/40');
        }

        const sourceContainer = document.getElementById('source-lang-container');
        const swapContainer = document.getElementById('swap-lang-container');
        const targetContainer = document.getElementById('target-lang-container');
        const targetLabel = document.getElementById('target-lang-label');

        if (tabName === 'text') {
            if (sourceContainer) sourceContainer.classList.remove('hidden');
            if (swapContainer) swapContainer.classList.remove('hidden');
            if (targetContainer) targetContainer.classList.remove('max-w-xs', 'mx-auto');
            if (targetLabel) targetLabel.textContent = '翻訳先';
        } else {
            if (sourceContainer) sourceContainer.classList.add('hidden');
            if (swapContainer) swapContainer.classList.add('hidden');
            if (targetContainer) targetContainer.classList.add('max-w-xs', 'mx-auto');
            if (targetLabel) targetLabel.textContent = '翻訳先言語';
        }
    }

    // ページ開いた時の初期実行
    switchTab("{{ active_mode or 'text' }}");

    // 初期化処理（DOM読み込み完了時）
    document.addEventListener('DOMContentLoaded', () => {
        // --- 【Step 1】 画像プレビュー＆ドラッグ＆ドロップ処理 ---
        const fileInput = document.getElementById('image-file-input');
        const dropArea = document.getElementById('image-drop-area');
        const previewImg = document.getElementById('image-preview');
        const placeholder = document.getElementById('upload-placeholder');
        const fileNameText = document.getElementById('img-file-name');

        if (fileInput && dropArea) {
            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) displayPreview(file);
            });

            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                }, false);
            });

            ['dragenter', 'dragover'].forEach(eventName => {
                dropArea.addEventListener(eventName, () => {
                    dropArea.classList.add('border-indigo-500', 'bg-slate-800/60');
                }, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, () => {
                    dropArea.classList.remove('border-indigo-500', 'bg-slate-800/60');
                }, false);
            });

            dropArea.addEventListener('drop', (e) => {
                const files = e.dataTransfer.files;
                if (files && files.length > 0) {
                    fileInput.files = files;
                    displayPreview(files[0]);
                }
            });
        }

        function displayPreview(file) {
            if (!file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                if (previewImg) {
                    previewImg.src = e.target.result;
                    previewImg.classList.remove('hidden');
                }
                if (placeholder) placeholder.classList.add('hidden');
                if (fileNameText) fileNameText.innerText = file.name;
            };
            reader.readAsDataURL(file);
        }

        // --- 【Step 2】 翻訳実行時のローディング表示 ＆ ボタン無効化（連打防止） ---
        document.querySelectorAll('form').forEach(form => {
            form.addEventListener('submit', function() {
                const submitBtn = this.querySelector('button[type="submit"]');
                if (submitBtn) {
                    submitBtn.disabled = true;
                    submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
                    submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 翻訳中...';
                }
            });
        });
    });

    // --- 【Step 3】 言語選択モーダル ＆ 即時切替処理 ---
    let currentSelectType = 'target'; // 'source' または 'target'

    // 主要対応言語リスト
    const languageList = [
        { code: 'ja', name: '日本語' },
        { code: 'en', name: 'English (英語)' },
        { code: 'zh', name: '中文 (中国語)' },
        { code: 'ko', name: '한국어 (韓国語)' },
        { code: 'es', name: 'Español (スペイン語)' },
        { code: 'fr', name: 'Français (フランス語)' },
        { code: 'de', name: 'Deutsch (ドイツ語)' },
        { code: 'it', name: 'Italiano (イタリア語)' },
        { code: 'ru', name: 'Русский (ロシア語)' },
        { code: 'th', name: 'ไทย (タイ語)' },
        { code: 'vi', name: 'Tiếng Việt (ベトナム語)' }
    ];

    function openLangModal(type) {
        currentSelectType = type;
        const modal = document.getElementById('lang-modal');
        const title = document.getElementById('modal-title');
        const searchInput = document.getElementById('lang-search-input');

        if (title) {
            title.textContent = type === 'source' ? '翻訳元言語を選択' : '翻訳先言語を選択';
        }
        if (searchInput) searchInput.value = '';

        renderLanguageList();
        if (modal) modal.classList.remove('hidden');
    }

    function closeLangModal() {
        const modal = document.getElementById('lang-modal');
        if (modal) modal.classList.add('hidden');
    }

    function renderLanguageList(filterText = '') {
        const listContainer = document.getElementById('lang-list');
        if (!listContainer) return;

        listContainer.innerHTML = '';

        languageList.forEach(lang => {
            if (filterText && !lang.name.toLowerCase().includes(filterText.toLowerCase())) return;

            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'w-full text-left px-4 py-3 rounded-2xl text-sm font-medium text-slate-200 hover:bg-indigo-600/20 hover:text-indigo-300 transition flex justify-between items-center border border-transparent hover:border-indigo-500/30';
            btn.innerHTML = `<span>${lang.name}</span><i class="fa-solid fa-chevron-right text-xs text-slate-500"></i>`;
            
            btn.onclick = () => selectLanguage(lang.code, lang.name.split(' ')[0]);
            listContainer.appendChild(btn);
        });
    }

    function filterLanguages() {
        const query = document.getElementById('lang-search-input').value;
        renderLanguageList(query);
    }

    function selectLanguage(code, displayName) {
        if (currentSelectType === 'source') {
            const sourceLabel = document.getElementById('source-lang-name');
            if (sourceLabel) sourceLabel.textContent = displayName;
            document.querySelectorAll('input[name="source_lang"]').forEach(el => el.value = code);
        } else {
            const targetLabel = document.getElementById('target-lang-name');
            const headerTargetLabel = document.getElementById('header-target-lang');
            if (targetLabel) targetLabel.textContent = displayName;
            if (headerTargetLabel) headerTargetLabel.textContent = displayName;
            document.querySelectorAll('input[name="target_lang"]').forEach(el => el.value = code);
        }

        // バックエンド（Flaskセッション）にも非同期で通知
        fetch(`/select-language?type=${currentSelectType}&lang=${code}`).catch(() => {});

        closeLangModal();
    }

    function swapLanguages() {
        const sourceLabel = document.getElementById('source-lang-name');
        const targetLabel = document.getElementById('target-lang-name');
        const headerTargetLabel = document.getElementById('header-target-lang');

        if (sourceLabel && targetLabel) {
            const tempText = sourceLabel.textContent;
            sourceLabel.textContent = targetLabel.textContent;
            targetLabel.textContent = tempText;
            if (headerTargetLabel) headerTargetLabel.textContent = targetLabel.textContent;
        }

        // バックエンド（Flaskセッション）に非同期で反転通知
        fetch('/swap-language').catch(() => {});
    }

    // 3. 音声認識処理
    let recognition = null;
    let isRecording = false;

    function toggleVoiceRecording() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert('お使いのブラウザは音声認識に対応していません。');
            return;
        }

        if (!recognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;

            recognition.onstart = () => {
                isRecording = true;
                const micIcon = document.getElementById('mic-icon');
                if (micIcon) micIcon.className = 'fa-solid fa-square text-red-400 animate-pulse';
                const status = document.getElementById('voice-status');
                if (status) status.innerText = '音声を入力中...';
            };

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                const vText = document.getElementById('voice_text');
                if (vText) vText.value = transcript;
                const vForm = document.getElementById('voice-form');
                if (vForm) vForm.classList.remove('hidden');
            };

            recognition.onend = () => {
                isRecording = false;
                const micIcon = document.getElementById('mic-icon');
                if (micIcon) micIcon.className = 'fa-solid fa-microphone';
                const vForm = document.getElementById('voice-form');
                if (vForm) vForm.submit();
            };
        }

        if (isRecording) {
            recognition.stop();
        } else {
            recognition.start();
        }
    }

    // 4. カメラ起動・撮影処理
    let videoStream = null;

    async function startCamera() {
        try {
            const video = document.getElementById('camera-video');
            const placeholder = document.getElementById('camera-placeholder');
            if (placeholder) placeholder.classList.add('hidden');
            if (video) video.classList.remove('hidden');

            videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            if (video) video.srcObject = videoStream;
        } catch (err) {
            alert('カメラ起動エラー: ' + err.message);
        }
    }

    function captureCamera() {
        const video = document.getElementById('camera-video');
        const canvas = document.getElementById('camera-canvas');
        
        if (!video || !video.srcObject) return;

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const dataUrl = canvas.toDataURL('image/jpeg');
        const camData = document.getElementById('camera_data');
        if (camData) camData.value = dataUrl;
        const camForm = document.getElementById('camera-form');
        if (camForm) camForm.submit();
    }

// 5. クリップボードコピー ＆ トースト通知
    function copyResult(elementId) {
        const targetEl = document.getElementById(elementId);
        if (!targetEl) return;
        
        const textToCopy = targetEl.innerText.trim();
        if (!textToCopy) return;

        navigator.clipboard.writeText(textToCopy).then(() => {
            showToast('コピーしました！');
        }).catch(() => {
            // クリップボードAPIが使えない場合のフォールバック処理
            const textarea = document.createElement('textarea');
            textarea.value = textToCopy;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showToast('コピーしました！');
        });
    }

    // トースト通知（ポップアップ吹き出し）を表示する共通関数
    function showToast(message) {
        // 既存のトーストがあれば即時削除
        const existingToast = document.getElementById('toast-notification');
        if (existingToast) existingToast.remove();

        // トースト要素を生成 (Tailwind CSS)
        const toast = document.createElement('div');
        toast.id = 'toast-notification';
        toast.className = 'fixed bottom-24 left-1/2 -translate-x-1/2 bg-slate-800 text-indigo-300 border border-indigo-500/40 text-xs font-semibold py-2.5 px-4 rounded-full shadow-2xl z-50 transition-all duration-300 opacity-0 transform translate-y-3 flex items-center gap-2 pointer-events-none backdrop-blur-md';
        toast.innerHTML = `<i class="fa-solid fa-circle-check text-indigo-400 text-sm"></i> <span>${message}</span>`;

        document.body.appendChild(toast);

        // 表示アニメーション（少し遅らせてフェードイン）
        requestAnimationFrame(() => {
            toast.classList.remove('opacity-0', 'translate-y-3');
        });

        // 2秒後に自動でフェードアウトして消去
        setTimeout(() => {
            toast.classList.add('opacity-0', 'translate-y-3');
            setTimeout(() => toast.remove(), 300);
        }, 2000);
    }
</script>
