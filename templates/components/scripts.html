<script>
    // Jinjaテンプレートからの変数渡しの定義
    const UI = {{ ui|tojson }};
    const SOURCE_CODE = {{ source_code|tojson }};
    const INITIAL_TAB = {{ active_mode|tojson }};
    const RESULT = {{ result_entry|tojson }};
    const LANGS = {{ lang_list|tojson }};
    const UI_LANG = {{ ui_lang|tojson }};
    const TARGET_LANG = {{ target_lang|tojson }};
    const DEFAULT_CONV = { A: {{ ui_lang|tojson }}, B: {{ target_lang|tojson }} };

    const $ = (id) => document.getElementById(id);
    const langByName = (name) => LANGS.find(l => l.name === name);
    const codeOf = (name) => (langByName(name) || {}).code || 'en-US';
</script>
